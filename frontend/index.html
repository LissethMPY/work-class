<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frontend</title>
  <link rel="stylesheet" href="style.css"> <!-- Agregar el enlace al archivo CSS -->
</head>
<body>
  <h1>Desde el Frontend de Lis y Andres</h1>
  <p id="mensaje">Cargando...</p>

  <script>
    fetch('http://localhost:4000/api/hello')
      .then(response => response.json())
      .then(data => {
        document.getElementById('mensaje').innerText = data.message;
      })
      .catch(error => {
        document.getElementById('mensaje').innerText = 'Error al conectar con el backend.';
        console.error(error);
      });
  </script>
</body>
</html>
